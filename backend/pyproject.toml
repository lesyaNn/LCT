[project]
name = "rtk-crm-backend"
version = "0.1.0"
description = "CRM взаимодействия с вузами — модульный монолит FastAPI (ИТ Школа РТК)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "minio>=7.2",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "reportlab>=4.1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 100
