[project]
name = "rtk-crm-backend"
version = "0.1.0"
description = "CRM взаимодействия с вузами — модульный монолит FastAPI (ИТ Школа РТК)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "psycopg[binary]==3.3.4",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-jose[cryptography]==3.5.0",
  "python-multipart==0.0.32",
  "redis==6.4.0",
  "minio==7.2.18",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "xlwt==1.3.0",
  "reportlab==4.4.9",
  "python-dateutil==2.9.0.post0",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1", "ruff==0.15.13", "pypdf==6.10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["var*", "tests*", "alembic*", "migrations*"]

[tool.setuptools.package-data]
app = ["assets/*.png", "assets/*.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/test_p4_04_pdf_unit.py" = ["E402"]
