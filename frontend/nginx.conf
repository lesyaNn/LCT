server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Baseline hardening (static SPA; API auth stays on Keycloak JWT).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Runtime config (rewritten by docker-entrypoint from env): never cache.
  location = /config.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Same-origin API proxy (P0-2): the SPA uses apiUrl="" by default, so
  # the browser never needs CORS against the backend. Direct-URL mode
  # (config apiUrl=http://host:8000) bypasses this proxy.
  # NOTE: $backend + resolver defers DNS to request time, so nginx also
  # starts outside compose (smoke tests) instead of failing on load.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_read_timeout 120s;
  }

  # Backend liveness under the same origin (frontend probes /api/health).
  location = /api/health {
    rewrite ^ /health break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    access_log off;
  }

  location / {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /health {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok";
  }
}
