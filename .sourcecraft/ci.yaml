on:
  pull_request:
    - workflows: [frontend-quality]
      filter:
        source_branches: ["**"]
        target_branches: ["main", "develop"]
  push:
    - workflows: [frontend-quality]
      filter:
        branches: ["main", "develop"]
        paths: ["frontend/**", ".sourcecraft/ci.yaml"]

workflows:
  frontend-quality:
    tasks:
      - name: frontend-quality
        cubes:
          - name: lint-typecheck-build
            image: docker.io/library/node:22-bookworm
            script:
              - cd frontend
              - npm ci
              - npm run lint
              - npm run typecheck
              - npm run test:network
              - npm run build

  frontend-e2e-smoke:
    # Run manually after the dedicated E2E stand and its repository secrets are ready.
    # Keeping this workflow out of the PR trigger lets quality checks run without E2E secrets.
    settings:
      max_cube_duration: 5m
    tasks:
      - name: read-only-smoke
        env:
          E2E_BASE_URL: ${{ secrets.e2e_base_url }}
          E2E_MANAGER_USERNAME: ${{ secrets.e2e_manager_username }}
          E2E_MANAGER_PASSWORD: ${{ secrets.e2e_manager_password }}
          E2E_UNIVERSITY_NAME: ${{ secrets.e2e_university_name }}
          E2E_WORKFLOW_INSTANCE_ID: ${{ secrets.e2e_workflow_instance_id }}
        cubes:
          - name: playwright-smoke
            image: mcr.microsoft.com/playwright:v1.63.0-noble
            script:
              - cd frontend
              - npm ci
              - npm run test:e2e:smoke
            artifacts:
              paths:
                - frontend/test-results
                - frontend/playwright-report
