# Explicit opt-in: downloads weights, indexes documentation, warms the model.
x-assistant-environment: &assistant-environment
  ASSISTANT_ENABLED: "true"
  ASSISTANT_OLLAMA_URL: http://ollama:11434
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3:1.7b}
  ASSISTANT_EMBEDDING_MODEL: ${ASSISTANT_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  ASSISTANT_DOCS_ROOT: /app/assistant-docs
  ASSISTANT_INDEX_PATH: /app/assistant-index/index.json
  ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-120}
  ASSISTANT_CONTEXT_TOKENS: ${ASSISTANT_CONTEXT_TOKENS:-4096}
  ASSISTANT_ANSWER_TOKENS: ${ASSISTANT_ANSWER_TOKENS:-256}
  ASSISTANT_RATE_LIMIT_PER_MINUTE: ${ASSISTANT_RATE_LIMIT_PER_MINUTE:-10}
  ASSISTANT_MAX_CONCURRENT: ${ASSISTANT_MAX_CONCURRENT:-1}
  ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-30}

services:
  backend:
    environment: *assistant-environment
    volumes:
      - ./frontend/public/docs:/app/assistant-docs:ro
      - assistant-index:/app/assistant-index
    depends_on:
      # Keep the CRM available while weights/index are being prepared.
      ollama:
        condition: service_healthy

  assistant-init:
    build: ./backend
    profiles: [assistant]
    restart: "no"
    networks: [rtk-net]
    environment: *assistant-environment
    command: ["python", "-m", "scripts.assistant", "bootstrap"]
    volumes:
      - ./frontend/public/docs:/app/assistant-docs:ro
      - assistant-index:/app/assistant-index
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.13.5
    profiles: [assistant]
    restart: unless-stopped
    networks: [rtk-net]
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - assistant-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  assistant-models:
  assistant-index:
