services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [rtk-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-rtk}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
    expose:
      # Internal only (P1 hardening): reach it via
      # `docker compose exec postgres psql -U rtk -d rtk`.
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap extra databases (keycloak) on FRESH pgdata only.
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtk} -d ${POSTGRES_DB:-rtk}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [rtk-net]
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    restart: unless-stopped
    networks: [rtk-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      # Persistent PostgreSQL storage (separate `keycloak` database, NOT rtk).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
    ports:
      # Published: browsers + admin console reach the IdP directly.
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # No curl in the Keycloak image: plain bash TCP probe + HTTP status check.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /realms/rtk HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \" 200 \" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build: ./backend
    restart: unless-stopped
    networks: [rtk-net]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      AUTH_DEV_BYPASS: "false"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-rtk}
      # External issuer as seen by browsers (P0-2: override per stand).
      KEYCLOAK_ISSUER: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8081}/realms/${KEYCLOAK_REALM:-rtk}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-rtk}/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-rtk-api}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      IMPORT_STAGING_DIR: /tmp/rtk-imports
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rtk}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-rtk}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_ROOT: /app/storage
      REPORTS_ROOT: /app/reports
      # Dev-2 analytics boundary: Dev-1 filter adapter (non-empty filters
      # in /analytics/* stop returning 503 FILTER_PROVIDER_NOT_CONFIGURED).
      P4_FILTER_PROVIDER: ${P4_FILTER_PROVIDER:-app.modules.analytics.dev1_provider:provider}
    volumes:
      # Staging survives backend restarts (P0-4: preview -> execute).
      - import-staging:/tmp/rtk-imports
      # P2-05 workflow file objects persist across restarts (never ephemeral).
      - workflow-storage:/app/storage
      # P4-06-01 generated reports persist across container recreation.
      - reports-storage:/app/reports
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    # P4-06-01: dedicated background worker (no BackgroundTasks in the API).
    # Owns report/import execution: atomic claim (SKIP LOCKED) -> run ->
    # ready, up to 3 attempts, then failed. Shares the backend image.
    build: ./backend
    restart: unless-stopped
    networks: [rtk-net]
    command: ["python", "-m", "app.modules.analytics.report_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rtk}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-rtk}
      REDIS_URL: redis://redis:6379/0
      IMPORT_STAGING_DIR: /tmp/rtk-imports
      REPORTS_ROOT: /app/reports
      P4_FILTER_PROVIDER: ${P4_FILTER_PROVIDER:-app.modules.analytics.dev1_provider:provider}
    volumes:
      - import-staging:/tmp/rtk-imports
      - reports-storage:/app/reports
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time fallbacks only; runtime /config.json (see env below) wins.
        VITE_KEYCLOAK_URL: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-rtk}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rtk-frontend}
        VITE_API_URL: ""
    restart: unless-stopped
    networks: [rtk-net]
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Runtime SPA config (P0-2): same image works on any host, no rebuild.
      # Empty API_URL = same-origin nginx /api/ proxy (default, no CORS).
      KEYCLOAK_URL: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-rtk}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rtk-frontend}
      API_URL: ${FRONTEND_API_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  rtk-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  import-staging:
  workflow-storage:
  reports-storage:
